<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;background:#dfe0d0;}</style>
</head><body>
<div id="gugong-sandian">
  <div class="gs-head">
    <h2>故宫三大殿</h2>
    <p class="text-small text-muted">太和殿 · 中和殿 · 保和殿｜左键拖拽旋转 · 滚轮缩放 · 右键平移</p>
  </div>
  <div class="gs-stage" id="gs-stage" role="img" aria-label="北京故宫三大殿三维模型：三层汉白玉台基上的太和殿、中和殿、保和殿">
    <div class="gs-loading" id="gs-loading">正在加载三维场景…</div>
  </div>
</div>

<style>
  #gugong-sandian { position: relative; width: 100%; }
  #gugong-sandian .gs-head { margin: 0 2px 8px; }
  #gugong-sandian h2 { margin: 0 0 2px; }
  #gugong-sandian .gs-head p { margin: 0; }
  #gugong-sandian .gs-stage { position: relative; width: 100%; height: 620px; border-radius: 10px; overflow: hidden; background: #dfe0d0; }
  @media (max-width: 640px) { #gugong-sandian .gs-stage { height: 430px; } }
  #gugong-sandian .gs-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted-foreground); font-size: 14px; pointer-events: none; }
  #gugong-sandian canvas { display: block; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('gs-stage');
  var loading = document.getElementById('gs-loading');
  function fail(msg) { if (loading) { loading.textContent = msg; } }
  if (!window.THREE) { fail('三维库加载失败，请刷新重试'); return; }
  if (!THREE.OrbitControls) { fail('交互控件加载失败，请刷新重试'); return; }

  /* ---------- 渲染器 / 相机 / 控制 ---------- */
  var VW = stage.clientWidth || 860, VH = stage.clientHeight || 620;
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) { fail('当前环境不支持 WebGL，无法显示三维模型'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(VW, VH);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.98;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, VW / VH, 1, 1200);
  camera.position.set(100, 55, 126);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 6, -28);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 25;
  controls.maxDistance = 420;
  controls.maxPolarAngle = Math.PI * 0.495;

  /* ---------- 天空 / 雾 / 地面 ---------- */
  function skyTexture() {
    var c = document.createElement('canvas'); c.width = 16; c.height = 256;
    var g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#6d92b3'); gr.addColorStop(0.45, '#a6bfd2');
    gr.addColorStop(0.75, '#d8dccc'); gr.addColorStop(1, '#eae6d5');
    g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  scene.background = skyTexture();
  scene.fog = new THREE.Fog(0xdfe0d0, 320, 750);

  function pavingTexture() {
    var c = document.createElement('canvas'); c.width = 256; c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = '#b5ad9b'; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(70,60,45,0.06)'; g.lineWidth = 2;
    for (var i = 0; i <= 256; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40);
    t.encoding = THREE.sRGBEncoding; return t;
  }
  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1000, 1000),
    new THREE.MeshStandardMaterial({ map: pavingTexture(), color: 0xffffff, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  var path = new THREE.Mesh(
    new THREE.BoxGeometry(18, 0.14, 48),
    new THREE.MeshStandardMaterial({ color: 0xd0c9b6, roughness: 0.95 })
  );
  path.position.set(0, 0.07, 66);
  path.receiveShadow = true;
  scene.add(path);

  /* ---------- 灯光 ---------- */
  var sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
  sun.position.set(90, 130, 85);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -155; sun.shadow.camera.right = 155;
  sun.shadow.camera.top = 155; sun.shadow.camera.bottom = -155;
  sun.shadow.camera.near = 20; sun.shadow.camera.far = 460;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.4;
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xcadcec, 0x9a8f7a, 0.65));
  scene.add(new THREE.AmbientLight(0xffffff, 0.08));

  /* ---------- 材质 ---------- */
  var C = {
    marble: 0xece8da, marble2: 0xe3decb, marble3: 0xf0ede0,
    wall: 0x992a1d, col: 0xa63a28, door: 0x6b1a10,
    roof: 0xce8f10, ridge: 0xa3740f, gold: 0xd2a43c, goldBright: 0xe6c05a,
    teal: 0x2c6e5e, teal2: 0x3c7f6a, fascia: 0x1e5c50,
    spout: 0xd8d2be
  };
  function std(color, rough, metal) {
    return new THREE.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.85 : rough, metalness: metal || 0 });
  }
  // 琉璃瓦垄灰度贴图（与屋面色相乘）：竖缝为筒瓦垄，横线为瓦件搭接
  function tileTexture() {
    var c = document.createElement('canvas'); c.width = 64; c.height = 64;
    var g = c.getContext('2d');
    g.fillStyle = '#fdfcf5'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = 'rgba(90,70,20,0.26)'; g.fillRect(0, 0, 3, 64);
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(4, 0, 3, 64);
    g.fillStyle = 'rgba(90,70,20,0.10)'; g.fillRect(0, 0, 64, 2);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  var M = {
    marble: std(C.marble, 0.92), marble2: std(C.marble2, 0.92), marble3: std(C.marble3, 0.9),
    wall: std(C.wall, 0.88), col: std(C.col, 0.8), door: std(C.door, 0.75),
    roof: new THREE.MeshStandardMaterial({ color: C.roof, roughness: 0.55, metalness: 0.12, side: THREE.DoubleSide, map: tileTexture() }),
    ridge: std(C.ridge, 0.5, 0.25), gold: std(C.gold, 0.35, 0.65), goldBright: std(C.goldBright, 0.3, 0.7),
    teal: std(C.teal, 0.7), teal2: std(C.teal2, 0.7), fascia: std(C.fascia, 0.7),
    spout: std(C.spout, 0.85)
  };
  function mesh(geo, mat, x, y, z) {
    var m = new THREE.Mesh(geo, mat);
    if (x) m.position.x = x;
    m.position.y = y || 0;
    if (z) m.position.z = z;
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  /* ---------- 屋面几何：凹曲环面（含瓦垄 UV） ---------- */
  // 环形矩形采样点 + 按周长弧长计算的 u 坐标（整圈对齐整数次重复，保证瓦垄无缝闭合）
  function ringRectPoints(hw, hd, y, segs) {
    var pts = [], us = [], i, t;
    var P = 4 * (hw + hd);
    var rep = Math.max(1, Math.round(P / 3.2));
    var k = rep / P;
    for (i = 0; i < segs; i++) { t = -hw + (2 * hw) * i / segs; pts.push(new THREE.Vector3(t, y, hd)); us.push((2 * hw) * i / segs * k); }
    for (i = 0; i < segs; i++) { t = hd - (2 * hd) * i / segs; pts.push(new THREE.Vector3(hw, y, t)); us.push((2 * hw + (2 * hd) * i / segs) * k); }
    for (i = 0; i < segs; i++) { t = hw - (2 * hw) * i / segs; pts.push(new THREE.Vector3(t, y, -hd)); us.push((4 * hw + (2 * hd) * i / segs) * k); }
    for (i = 0; i < segs; i++) { t = -hd + (2 * hd) * i / segs; pts.push(new THREE.Vector3(-hw, y, t)); us.push((4 * hw + 2 * hd + (2 * hd) * i / segs) * k); }
    return { pts: pts, us: us };
  }
  function surfaceFromRings(rings, vRep) {
    var pos = [], uv = [], idx = [], n = rings[0].pts.length, rows = rings.length - 1, r, i, j, ring;
    for (r = 0; r < rings.length; r++) {
      ring = rings[r];
      for (i = 0; i < n; i++) {
        pos.push(ring.pts[i].x, ring.pts[i].y, ring.pts[i].z);
        uv.push(ring.us[i], rows > 0 ? (r / rows) * (vRep || 6) : 0);
      }
    }
    for (r = 0; r < rows; r++) {
      for (i = 0; i < n; i++) {
        j = (i + 1) % n;
        idx.push(r * n + i, r * n + j, (r + 1) * n + j, r * n + i, (r + 1) * n + j, (r + 1) * n + i);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  // 矩形(hw0,hd0)收缩到(hw1,hd1)的凹曲屋面，lift 为檐角起翘量
  function ringSurface(hw0, hd0, hw1, hd1, H, o) {
    o = o || {};
    var p = o.p || 1.9, lift = o.lift || 0, rings = [], n = o.rings || 7, segs = o.segs || 5, k, s, hw, hd, y, rr, i, v, cf;
    for (k = 0; k <= n; k++) {
      s = k / n;
      hw = THREE.MathUtils.lerp(hw0, hw1, s);
      hd = THREE.MathUtils.lerp(hd0, hd1, s);
      y = H * Math.pow(s, p);
      rr = ringRectPoints(hw, hd, y, segs);
      if (lift > 0 && s < 1) {
        for (i = 0; i < rr.pts.length; i++) {
          v = rr.pts[i];
          cf = Math.max(Math.abs(v.x) / Math.max(hw, 0.001), Math.abs(v.z) / Math.max(hd, 0.001));
          v.y += lift * Math.pow(1 - s, 1.6) * Math.pow(cf, 3);
        }
      }
      rings.push(rr);
    }
    return surfaceFromRings(rings);
  }
  function hipEdgePoints(sx, sz, hw0, hd0, hw1, hd1, H, p, lift, up) {
    var pts = [], n = 14, k, s;
    for (k = 0; k <= n; k++) {
      s = k / n;
      pts.push(new THREE.Vector3(
        sx * THREE.MathUtils.lerp(hw0, hw1, s),
        H * Math.pow(s, p) + lift * Math.pow(1 - s, 1.6) + up,
        sz * THREE.MathUtils.lerp(hd0, hd1, s)
      ));
    }
    return pts;
  }
  function tubeFromPoints(pts, radius) {
    return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, radius, 5, false);
  }

  /* ---------- 屋顶组件 ---------- */
  // 重檐庑殿上檐 / 单檐庑殿：屋面 + 戗脊 + 正脊 + 鸱吻 + 走兽
  function hipRoof(W, D, H, R, o) {
    o = o || {};
    var p = o.p || 1.9, lift = o.lift == null ? 0.5 : o.lift;
    var g = new THREE.Group();
    g.add(mesh(ringSurface(W / 2, D / 2, R / 2, 0.02, H, { p: p, lift: lift }), M.roof));
    var signs = [[1, 1], [1, -1], [-1, -1], [-1, 1]], i, pts;
    for (i = 0; i < 4; i++) {
      pts = hipEdgePoints(signs[i][0], signs[i][1], W / 2, D / 2, R / 2, 0.02, H, p, lift, 0.26);
      g.add(mesh(tubeFromPoints(pts, 0.22), M.ridge));
    }
    g.add(mesh(new THREE.BoxGeometry(R + 0.8, 0.72, 0.95), M.ridge, 0, H + 0.28, 0));
    for (i = 0; i < 2; i++) {
      var kwen = mesh(new THREE.BoxGeometry(0.85, 1.5, 0.65), M.ridge, (i ? 1 : -1) * (R / 2 + 0.55), H + 0.95, 0);
      kwen.add(mesh(new THREE.SphereGeometry(0.26, 8, 8), M.gold, 0, 0.95, 0));
      g.add(kwen);
    }
    var beasts = o.beasts || 0;
    if (beasts > 0) {
      var coneGeo = new THREE.ConeGeometry(0.15, 0.5, 6);
      for (i = 0; i < 4; i++) {
        pts = hipEdgePoints(signs[i][0], signs[i][1], W / 2, D / 2, R / 2, 0.02, H, p, lift, 0.3);
        for (var b = 0; b < beasts; b++) {
          var pt = pts[Math.min(pts.length - 1, 1 + b)];
          g.add(mesh(coneGeo, M.gold, pt.x, pt.y + 0.22, pt.z));
        }
      }
    }
    return g;
  }
  // 下檐环（截头庑殿檐）
  function eaveRing(W0, D0, W1, D1, H, o) {
    o = o || {};
    return mesh(ringSurface(W0 / 2, D0 / 2, W1 / 2, D1 / 2, H, { p: o.p || 1.9, lift: o.lift == null ? 0.35 : o.lift }), M.roof);
  }
  // 歇山上檐：环面 + 前后坡 + 山花 + 博风板 + 正脊
  function xieshanRoof(W, D, Hw, H2, Wa, Da, o) {
    o = o || {};
    var p = o.p || 1.9, lift = o.lift == null ? 0.4 : o.lift;
    var g = new THREE.Group();
    g.add(mesh(ringSurface(W / 2, D / 2, Wa / 2, Da / 2, Hw, { p: p, lift: lift }), M.roof));
    var hw = Wa / 2, hd = Da / 2;
    var v = [];
    function quad(a, b, c, d) { v.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], a[0], a[1], a[2], c[0], c[1], c[2], d[0], d[1], d[2]); }
    quad([-hw, Hw, hd], [hw, Hw, hd], [hw, Hw + H2, 0], [-hw, Hw + H2, 0]);
    quad([hw, Hw, -hd], [-hw, Hw, -hd], [-hw, Hw + H2, 0], [hw, Hw + H2, 0]);
    v.push(hw, Hw, hd, hw, Hw, -hd, hw, Hw + H2, 0);
    v.push(-hw, Hw, hd, -hw, Hw, -hd, -hw, Hw + H2, 0);
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
    var uvs = [];
    for (var q = 0; q < v.length; q += 3) uvs.push(v[q] * 0.3 + 60, v[q + 1] * 0.55);
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.computeVertexNormals();
    g.add(mesh(geo, M.roof));
    for (var i = 0; i < 2; i++) {
      var sx = i ? 1 : -1;
      var disc = mesh(new THREE.CircleGeometry(1.15, 24), M.goldBright, sx * (hw + 0.08), Hw + H2 * 0.45, 0);
      disc.rotation.y = sx * Math.PI / 2;
      g.add(disc);
    }
    var len = Math.hypot(hd, H2) + 0.4, ang = Math.atan2(hd, H2), szs = [1, -1], sxs = [1, -1], s, zz;
    for (s = 0; s < 2; s++) {
      for (zz = 0; zz < 2; zz++) {
        var bf = mesh(new THREE.BoxGeometry(0.55, len, 0.35), M.ridge, sxs[s] * (hw + 0.06), Hw + H2 / 2, szs[zz] * hd / 2);
        bf.rotation.x = szs[zz] > 0 ? -ang : ang;
        g.add(bf);
      }
    }
    var signs = [[1, 1], [1, -1], [-1, -1], [-1, 1]];
    for (i = 0; i < 4; i++) {
      var pts = hipEdgePoints(signs[i][0], signs[i][1], W / 2, D / 2, Wa / 2, Da / 2, Hw, p, lift, 0.24);
      g.add(mesh(tubeFromPoints(pts, 0.2), M.ridge));
    }
    g.add(mesh(new THREE.BoxGeometry(Wa + 0.8, 0.72, 0.9), M.ridge, 0, Hw + H2 + 0.26, 0));
    for (i = 0; i < 2; i++) {
      var kwen = mesh(new THREE.BoxGeometry(0.85, 1.5, 0.65), M.ridge, (i ? 1 : -1) * (Wa / 2 + 0.55), Hw + H2 + 0.95, 0);
      kwen.add(mesh(new THREE.SphereGeometry(0.26, 8, 8), M.gold, 0, 0.95, 0));
      g.add(kwen);
    }
    var beasts = o.beasts || 0;
    if (beasts > 0) {
      var coneGeo = new THREE.ConeGeometry(0.14, 0.48, 6);
      for (i = 0; i < 4; i++) {
        var hpts = hipEdgePoints(signs[i][0], signs[i][1], W / 2, D / 2, Wa / 2, Da / 2, Hw, p, lift, 0.28);
        for (var b = 0; b < beasts; b++) {
          var pt = hpts[Math.min(hpts.length - 1, 1 + b)];
          g.add(mesh(coneGeo, M.gold, pt.x, pt.y + 0.2, pt.z));
        }
      }
    }
    return g;
  }
  // 四角攒尖顶（中和殿）+ 鎏金宝顶
  function pyramidRoof(W, H, o) {
    o = o || {};
    var p = o.p || 1.9, lift = o.lift == null ? 0.5 : o.lift;
    var g = new THREE.Group();
    g.add(mesh(ringSurface(W / 2, W / 2, 0.02, 0.02, H, { p: p, lift: lift }), M.roof));
    var signs = [[1, 1], [1, -1], [-1, -1], [-1, 1]];
    for (var i = 0; i < 4; i++) {
      var pts = hipEdgePoints(signs[i][0], signs[i][1], W / 2, W / 2, 0, 0, H, p, lift, 0.26);
      g.add(mesh(tubeFromPoints(pts, 0.2), M.ridge));
      var coneGeo = new THREE.ConeGeometry(0.14, 0.46, 6);
      var pt = pts[2];
      g.add(mesh(coneGeo, M.gold, pt.x, pt.y + 0.2, pt.z));
    }
    g.add(mesh(new THREE.CylinderGeometry(0.62, 0.85, 1.4, 10), M.ridge, 0, H + 0.75, 0));
    g.add(mesh(new THREE.SphereGeometry(1.35, 18, 14), M.goldBright, 0, H + 2.35, 0));
    g.add(mesh(new THREE.SphereGeometry(0.4, 10, 8), M.goldBright, 0, H + 3.7, 0));
    return g;
  }

  /* ---------- 檐下构件 ---------- */
  function fasciaRect(g, y, w, d) {
    var t = 0.3, h = 0.55;
    g.add(mesh(new THREE.BoxGeometry(w + t, h, 0.28), M.fascia, 0, y, d / 2 + 0.06));
    g.add(mesh(new THREE.BoxGeometry(w + t, h, 0.28), M.fascia, 0, y, -d / 2 - 0.06));
    g.add(mesh(new THREE.BoxGeometry(0.28, h, d + t), M.fascia, w / 2 + 0.06, y, 0));
    g.add(mesh(new THREE.BoxGeometry(0.28, h, d + t), M.fascia, -w / 2 - 0.06, y, 0));
    g.add(mesh(new THREE.BoxGeometry(w + t, 0.14, 0.32), M.gold, 0, y + 0.36, d / 2 + 0.07));
    g.add(mesh(new THREE.BoxGeometry(w + t, 0.14, 0.32), M.gold, 0, y + 0.36, -d / 2 - 0.07));
    g.add(mesh(new THREE.BoxGeometry(0.32, 0.14, d + t), M.gold, w / 2 + 0.07, y + 0.36, 0));
    g.add(mesh(new THREE.BoxGeometry(0.32, 0.14, d + t), M.gold, -w / 2 - 0.07, y + 0.36, 0));
  }
  function colRect(list, w, d, h, nF, nS) {
    var i, x, z;
    for (i = 0; i < nF; i++) {
      x = -w / 2 + w * i / (nF - 1);
      list.push({ p: [x, 0, d / 2], s: [1, h, 1] });
      list.push({ p: [x, 0, -d / 2], s: [1, h, 1] });
    }
    for (i = 1; i <= nS; i++) {
      z = -d / 2 + d * i / (nS + 1);
      list.push({ p: [w / 2, 0, z], s: [1, h, 1] });
      list.push({ p: [-w / 2, 0, z], s: [1, h, 1] });
    }
  }
  function doorRow(g, y, h, w, n, span, z) {
    for (var i = 0; i < n; i++) {
      var x = -span / 2 + span * i / (n - 1);
      g.add(mesh(new THREE.BoxGeometry(w, h, 0.28), M.door, x, y + h / 2, z));
    }
    g.add(mesh(new THREE.BoxGeometry(span + w, 0.3, 0.34), M.gold, 0, y + h + 0.2, z + 0.02));
  }
  function doorRowRot(g, y, h, w, n, span, z, ry) {
    var sub = new THREE.Group();
    doorRow(sub, y, h, w, n, span, z);
    sub.rotation.y = ry;
    g.add(sub);
  }

  /* ---------- 三层汉白玉台基（工字形） ---------- */
  var zA = -16, zB = -62, zF = 36, zN = -122;
  var tierColor = [std(0xdcd6c2, 0.92), std(0xe4dfcc, 0.92), std(0xece8da, 0.92)];
  var bandMat = std(0xd7d1bc, 0.92);
  for (var tier = 0; tier < 3; tier++) {

  var savedState = null;
  try {
    if (window.zcode && window.zcode.widgetState && window.zcode.widgetState.privateContent) {
      savedState = window.zcode.widgetState.privateContent;
    }
  } catch (e) { savedState = null; }
  var autoRot = true;
  if (savedState && savedState.cam && savedState.tgt) {
    camera.position.set(savedState.cam[0], savedState.cam[1], savedState.cam[2]);
    controls.target.set(savedState.tgt[0], savedState.tgt[1], savedState.tgt[2]);
    autoRot = false;
  }
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) autoRot = false;
  } catch (e) {}
  controls.autoRotate = autoRot;
  controls.autoRotateSpeed = 0.55;
  controls.addEventListener('start', function () { controls.autoRotate = false; });
  controls.addEventListener('end', function () {
    try {
      if (window.zcode && window.zcode.setWidgetState) {
        window.zcode.setWidgetState({
          privateContent: {
            cam: [camera.position.x, camera.position.y, camera.position.z],
            tgt: [controls.target.x, controls.target.y, controls.target.z]
          }
        }).catch(function () {});
      }
    } catch (e) {}
  });

  /* ---------- 自适应 ---------- */
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(function () {
      var w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }).observe(stage);
  }

  /* ---------- 渲染循环 ---------- */
  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
